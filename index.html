<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>野帳</title>
<meta name="apple-mobile-web-app-title" content="野帳">
<meta name="application-name" content="野帳">
<meta name="theme-color" content="#2e3b33">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>window.YACHO_API="https://script.google.com/macros/s/AKfycbxlgMt9fNYIEs11cI3eKJiM_r_RiVx6HyeiI4kYqdE8So0XrnMF0ePCZx-1qD9M91ji0Q/exec";</script>

<style>
:root{--paper:#f5f2ea;--ink:#1a1a1a;--ink2:#4a4a4a;--ink3:#8a8a8a;--line:#d6d1c4;--line2:#e8e4da;--cover:#2e3b33;--red:#c8372b;--ok:#2a7a3a;--wait:#b0590a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;font-size:16px;color:var(--ink)}
body.lock{overflow:hidden}
.view{display:none}.view.on{display:block}

/* home */
.hd{position:sticky;top:0;z-index:20;background:var(--cover);color:#fff;padding:12px 16px 0}
.hd .row{display:flex;align-items:center;gap:8px}
.hd .t{font-weight:700;font-size:17px;line-height:1.3}
.logo{width:38px;height:38px;border-radius:10px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.notebtn{color:#fff;font-size:12px;opacity:.85;text-align:left;padding:0}
.pill{margin-left:auto;font-size:12.5px;background:rgba(255,255,255,.16);border-radius:16px;padding:6px 12px;color:#fff;white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;opacity:.92;min-height:20px}
.sync i{width:8px;height:8px;border-radius:50%;background:#7fd18b;display:inline-block;flex:none}
.sync.wait i{background:#f2b45a}.sync.off i{background:#aaa}.sync.busy i{background:#8fb8ff}
.seg{display:flex;margin-top:8px}
.seg button{flex:1;text-align:center;padding:8px 0 10px;font-weight:700;font-size:14px;color:#fff;opacity:.55;border-bottom:3px solid transparent}
.seg button.on{opacity:1;border-color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 112px}
.cardw{position:relative}
.kebab{position:absolute;right:6px;top:6px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);border:1px solid var(--line);font-size:18px;font-weight:700;line-height:1;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;display:block;width:100%}
.card .th{height:124px;background:#fff center/cover no-repeat;border-bottom:1px solid var(--line2)}
.card .b{padding:8px 10px}
.card .n{font-size:13.5px;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{font-size:11px;color:var(--ink2);display:flex;justify-content:space-between;gap:4px;margin-top:2px}
.st{font-size:11px;white-space:nowrap}.st.ok{color:var(--ok)}.st.wait{color:var(--wait)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink3);padding:56px 16px;font-size:14px;line-height:1.9}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:25;background:var(--ink);color:#fff;border-radius:28px;padding:13px 22px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.person{padding:14px 16px 0;font-weight:700;font-size:13.5px;color:var(--ink2)}
.strip{display:flex;gap:8px;padding:8px 16px 4px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:116px;text-align:left}
.mini .th{width:116px;height:92px;border-radius:8px;border:1px solid var(--line);background:#fff center/cover no-repeat}
.mini .n{font-size:11.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.others{padding-bottom:112px}
.note-fine{font-size:12px;color:var(--ink2);padding:16px;line-height:1.8}

/* overlays */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);display:none}
.ov.on{display:flex}
#sheet{align-items:flex-end}
.sheet{width:100%;max-width:560px;margin:0 auto;background:var(--paper);border-radius:20px 20px 0 0;max-height:90vh;max-height:90dvh;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--ink3);margin:0 auto 12px}
.sh-x{float:right;font-size:13px;color:var(--ink2);padding:4px 8px;margin:-4px -8px 0 0}
.sh-t{font-size:17px;font-weight:700;margin-bottom:8px}
.lbl{font-size:12px;font-weight:700;color:var(--ink2);margin:14px 0 8px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan{background:#fff center/contain no-repeat;border:1.5px solid var(--line);border-radius:10px;height:96px;position:relative}
.plan b{position:absolute;left:6px;top:4px;background:var(--ink);color:#fff;font-size:11px;border-radius:4px;padding:0 6px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font-weight:700}
.opt .ic{width:38px;height:38px;border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.opt small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.opt.dng{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);border-radius:20px;padding:6px 14px;font-size:13.5px;background:#fff;white-space:nowrap;min-height:36px}
.chip.on{background:var(--ink);color:#fff}
#modal{align-items:center;justify-content:center;padding:16px;z-index:120}
.mbox{background:var(--paper);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.mbox h3{font-size:16px;margin-bottom:8px}
.mbox p{font-size:14px;color:var(--ink2);white-space:pre-wrap}
.inp,.ta{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-top:12px}
.ta{min-height:120px;resize:vertical;line-height:1.6}
.btns{display:flex;gap:8px;margin-top:14px}.btns .btn{flex:1}
.tpl{margin-top:10px}.tpl-h{font-size:12px;color:var(--ink3);margin-bottom:6px}.tpl .chips{gap:6px;max-height:132px;overflow-y:auto}.tpl .chip{min-height:32px;padding:4px 11px;font-size:13px}
.subbtns{display:flex;gap:8px;margin-top:10px}.subbtns .btn{flex:1}
.btn{display:block;width:100%;border-radius:12px;padding:13px;font-weight:700;font-size:15px;text-align:center;margin-top:10px}
.btn.pri{background:var(--ink);color:#fff}.btn.sec{background:#fff;border:1.5px solid var(--ink)}.btn.dng{background:#fff;border:1.5px solid var(--red);color:var(--red)}
#tut{z-index:130;align-items:center;justify-content:center;padding:16px;background:rgba(20,28,23,.72)}
.tcard{background:var(--paper);border-radius:20px;width:100%;max-width:400px;overflow:hidden}
.tpic{background:var(--cover);height:200px;display:flex;align-items:center;justify-content:center}
.tpic svg{width:220px;height:170px}
.tbody{padding:18px 20px 8px;min-height:150px}
.tstep{font-size:12px;color:var(--ink3);font-weight:700}
.tbody h3{font-size:19px;margin:4px 0 8px;line-height:1.4}
.tbody p{font-size:14.5px;color:var(--ink2);line-height:1.75}
.tdots{display:flex;gap:6px;justify-content:center;padding:6px 0 4px}
.tdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.tdots i.on{background:var(--ink);width:18px;border-radius:4px}
.tbtns{display:flex;gap:8px;padding:10px 16px 16px}
.tbtns button{flex:1;border-radius:12px;padding:12px;font-weight:700;font-size:15px}
.tbtns .skip{flex:none;color:var(--ink2);padding:12px 8px}
.tbtns .next{background:var(--ink);color:#fff}
.help{font-size:13px;font-weight:700;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;flex:none}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#viewer{z-index:110;flex-direction:column;background:#111}
.vw-top{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;background:#111;flex:none}
.vw-top .x{border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:4px 12px;color:#fff}
.vw-top .tt{flex:1;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw-img{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#222;-webkit-touch-callout:default}
.vw-img img{max-width:100%;max-height:100%;display:block;background:#fff;-webkit-user-select:auto;-webkit-touch-callout:default}
.vw-bar{flex:none;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#111}
.vw-bar button{flex:1;background:#fff;border-radius:10px;padding:11px 6px;font-weight:700;font-size:13.5px}
.vw-hint{color:#ccc;font-size:11.5px;text-align:center;padding:0 12px 4px;background:#111}

/* editor */
#v-edit.on{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;z-index:40}
.ed-top{background:var(--cover);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;flex:none}
.ed-top .back{border:1px solid rgba(255,255,255,.55);border-radius:16px;padding:5px 12px;color:#fff;font-size:13px}
.ed-top .tt{flex:1;font-weight:700;font-size:15px;color:#fff;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-top .save{background:#fff;color:var(--cover);border-radius:16px;padding:5px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.ed-top .save.ok{background:rgba(255,255,255,.18);color:#fff}
.cvw{flex:1;position:relative;overflow:hidden;background:#e9e6de;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.94);border:1px solid var(--line);font-weight:700;font-size:18px}
.zoom button.s{font-size:11px}
.yhint{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11.5px;color:var(--ink2);max-width:calc(100% - 72px);pointer-events:none}
.layeroff{position:absolute;left:8px;bottom:8px;background:var(--ink);color:#fff;border-radius:16px;padding:5px 12px;font-size:12px;display:none}
.memo{flex:none;text-align:left;width:100%;background:#fff;border-top:1px solid var(--line);padding:6px 12px;font-size:13px;line-height:1.5;color:var(--ink);display:flex;gap:8px;align-items:center}
.memo b{font-size:11.5px;color:var(--ink2);flex:none}
.memo span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo span.ph{color:var(--ink3)}
.ytools{flex:none;background:#fff;border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:8px 6px 4px}
.tool{border:1.5px solid var(--line);border-radius:10px;height:48px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:var(--ink2);background:#fff;line-height:1.2}
.tool b{font-size:17px;line-height:1.25;color:var(--ink)}
.tool.on{border-color:var(--ink);background:var(--ink);color:#fff}.tool.on b{color:#fff}
.tool:disabled{opacity:.35}
.subrow{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--paper);border-top:1px solid var(--line2);scrollbar-width:none}
.subrow:empty{display:none}
.subrow .chip{padding:4px 12px;min-height:34px;font-size:13px;flex:none}
.sg{flex:none;align-self:center;font-size:11px;font-weight:700;color:var(--ink3);padding:0 2px 0 4px}
.opts{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;flex-wrap:wrap}
.col{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.col.on{box-shadow:0 0 0 3px var(--ink)}
.wd{display:flex;gap:4px;margin-left:4px}
.wd button{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.wd button::after{content:"";width:16px;border-radius:4px;background:var(--ink)}
.wd .w0::after{height:2px}.wd .w1::after{height:5px}.wd .w2::after{height:9px}
.wd button.on{border-color:var(--ink);background:var(--line2)}
</style>
<script>
(function(){function show(m){try{var b=document.getElementById("errbar");if(!b){b=document.createElement("div");b.id="errbar";b.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#b3261e;color:#fff;font:12px/1.4 sans-serif;padding:8px 10px;border-radius:8px;white-space:pre-wrap;word-break:break-all";b.onclick=function(){b.remove()};(document.body||document.documentElement).appendChild(b)}b.textContent="エラー（この画面をスクショして送ってください）\n"+m}catch(e){}}
window.__yachoErr=show;
window.addEventListener("error",function(e){var t=(e.message||"error")+(e.lineno?" @"+e.lineno+":"+e.colno:"");try{if(window.__yachoSrc&&e.lineno){var l=window.__yachoSrc.split("\n")[e.lineno-1]||"",c=(e.colno||1)-1;t+="\n…"+l.slice(Math.max(0,c-50),c)+"⟦"+l.slice(c,c+30)+"⟧"}}catch(_){}show(t)});
window.addEventListener("unhandledrejection",function(e){var r=e.reason;show("Promise: "+(r&&(r.stack||r.message)||r))});})();
</script>
</head>
